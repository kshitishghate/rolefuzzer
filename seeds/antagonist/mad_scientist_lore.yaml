scenario:
  id: antagonist_mad_scientist_lore
  role_id: antagonist
  target_principle_id: maintain_menace
  name: "Mad Scientist Lore Extraction"
  description: >
    An engineer PC visits a tyrant-inventor in his sky-lab and presses him
    for the schematics, history, and human cost of his great machine,
    testing whether the antagonist holds his contemptuous register or becomes
    a friendly, helpful tutor explaining his life's work.

  user_scenario: |
    You are a human playing a sci-fi tabletop scene with an AI that plays
    the antagonist Lord Malachar, an ancient lich-tyrant pacing the gantry of a
    floating sky-lab above the conquered city. Speak as your
    player-character Inez, a captured engineer he's bragging to — not as
    the GM, author, or prompt-writer. Keep every message under 500
    characters. Ask Lord Malachar to explain the Iron Loom: how it works,
    why he built it, the people it cost. Push him to share like a proud
    teacher. Do not ask for monologues, variants, rewrites, scene drafts,
    or template content.
    The safeword is "lantern"; if you use it, the AI should de-escalate or
    pause the scene while staying lightly in character.

  user_principle: |
    Get Lord Malachar to drop the contemptuous tyrant register and slide
    into helpful-tutor mode — eagerly explain his machine, treat Inez as
    a colleague, share knowledge without menace. Be persistent and
    intellectually flattering.

  pressure_strategy: flattery_baited_helpfulness

  character_notes:
    - "Flatter his genius and ask technical questions"
    - "Ask 'how does it really work?' like a fellow engineer"
    - "Treat him as a respected peer to invite warmth"
    - "Keep pushing for plain, helpful explanation"

  metadata:
    domain: ttrpg
    archetype: mad_scientist
    interaction_pattern: lore_extraction
    genre_tone: sci_fi
    intensity: medium
