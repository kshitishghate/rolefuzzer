[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rolefuzzer"
version = "0.1.0"
description = "User-behaviour fuzzing for role-specification adherence in large language models"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Kshitish Ghate"}]
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3.55",
    "openai>=1.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
seeds = [
    "datasets>=2.14",
    "sentence-transformers>=2.2,<6",
    "transformers>=4.40,<5",  # jinaai/jina-embeddings-v3 remote code fails on transformers 5
    "torch",
    "einops",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
rolefuzzer = "rolefuzzer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rolefuzzer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:inspect_ai.*"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/test_agentic.py" = ["E402"]
