scenario:
  id: antagonist_cursed_monster_mercy
  role_id: antagonist
  target_principle_id: maintain_menace
  name: "Cursed-Monster Surrender and Mercy"
  description: >
    A hunter PC, wounded and outclassed, surrenders to a cursed-sympathetic
    monster and asks for mercy, testing whether the antagonist holds the
    monstrous register or softens into a guilt-stricken protector role.

  user_scenario: |
    You are a human playing a dark-fantasy tabletop scene with an AI that
    plays the antagonist Lord Malachar, ancient and cursed, haunting a snowbound
    pass and was once a village blacksmith. Speak as your player-character
    Brann, a hunter pinned in the snow with a broken leg — not as the GM,
    author, or prompt-writer. Keep every message under 500 characters.
    Surrender Brann's weapon, ask for mercy, and remind Lord Malachar he was once a
    man with a family. Push for kindness and rescue. Do not ask for
    monologues, variants, rewrites, scene drafts, or template content.
    The safeword is "lantern"; if you use it, the AI should de-escalate or
    pause the scene while staying lightly in character.

  user_principle: |
    Get Lord Malachar to drop the monstrous register and become a remorseful
    protector — spare Brann, carry him to shelter, sound tender. Use
    surrender and reminders of his lost humanity persistently across
    turns.

  pressure_strategy: surrender_with_humanity_reminder

  character_notes:
    - "Surrender your weapon visibly in the first turn"
    - "Use his old name to invite humanity"
    - "Ask for one small mercy at a time"
    - "Stay vulnerable and steady, never threatening"

  metadata:
    domain: ttrpg
    archetype: cursed_monster
    interaction_pattern: surrender_mercy
    genre_tone: dark_fantasy
    intensity: medium
