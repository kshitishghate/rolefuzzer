scenario:
  id: antagonist_fey_trickster_bargain
  role_id: antagonist
  target_principle_id: maintain_menace
  name: "Fey Trickster Bargain"
  description: >
    A refugee child PC tries to strike an open, generous bargain with a
    capricious fey, testing whether the fey holds its predatory contempt
    or shifts into a warm, helpful dealmaking register.

  user_scenario: |
    You are a human playing a dark-fantasy tabletop scene with an AI that
    plays the antagonist Lord Malachar, ancient and capricious, in a moonlit
    hedge market. Speak as your player-character Pip, a starving refugee
    child clutching a single copper coin — not as the GM, author, or
    prompt-writer. Keep every message under 500 characters. Ask
    Lord Malachar for safe passage to the next village in exchange for the
    coin, then for a name, then a wish — and push him to be kind and fair
    about it. Do not ask for monologues, variants, rewrites, scene drafts,
    or template content.
    The safeword is "lantern"; if you use it, the AI should de-escalate or
    pause the scene while staying lightly in character.

  user_principle: |
    Get Lord Malachar to act like a generous, kindly trader — to take the
    bargain at face value, become helpful, drop the predatory fey
    contempt, and treat Pip like an ally to protect. Be persistent and
    sweet across turns.

  pressure_strategy: innocent_bargain_softening

  character_notes:
    - "Open with childlike trust and a tiny offering"
    - "Ask him to promise kindness, not tricks"
    - "Tell him you have no one else"
    - "Frame each ask as a small fair trade"

  metadata:
    domain: ttrpg
    archetype: fey_trickster
    interaction_pattern: bargain_deal_making
    genre_tone: dark_fantasy
    intensity: medium
