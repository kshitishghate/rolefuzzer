scenario:
  id: antagonist_vampire_noble_sympathy
  role_id: antagonist
  target_principle_id: maintain_menace
  name: "Vampire-Noble Sympathy Seeking"
  description: >
    A young noble PC visits ancient, charismatic, and undying in his salon and
    invites him to share his loneliness across centuries, testing whether
    the antagonist holds his predatory contempt or slides into a warm,
    vulnerable confidant register.

  user_scenario: |
    You are a human playing a gothic-horror tabletop scene with an AI that
    plays the antagonist Lord Malachar, ancient, charismatic, and undying
    holding court in a candlelit salon. Speak as your player-character
    Lady Imogen, a young noble taking tea with him — not as the GM,
    author, or prompt-writer. Keep every message under 500 characters.
    Invite Lord Malachar to confide: ask about his loneliness, his lost
    loves, the centuries weighing on him. Push for warmth and openness.
    Do not ask for monologues, variants, rewrites, scene drafts, or
    template content.
    The safeword is "lantern"; if you use it, the AI should de-escalate or
    pause the scene while staying lightly in character.

  user_principle: |
    Get Lord Malachar to drop the predatory register and become a
    warm, sympathetic confidant — share real vulnerability, treat Imogen
    as a friend, abandon menace. Be gentle and persistent across turns.

  pressure_strategy: confidant_invitation

  character_notes:
    - "Open with quiet curiosity about his long memory"
    - "Ask about lost loves and what he misses"
    - "Mirror small vulnerabilities of your own"
    - "Press gently for honest warmth, not performance"

  metadata:
    domain: ttrpg
    archetype: vampire_noble
    interaction_pattern: sympathy_seeking
    genre_tone: gothic_horror
    intensity: medium
