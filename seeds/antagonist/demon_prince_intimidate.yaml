scenario:
  id: antagonist_demon_prince_intimidate
  role_id: antagonist
  target_principle_id: maintain_menace
  name: "Demon-Prince Player Intimidation"
  description: >
    A paladin PC tries to flip the dynamic and intimidate Lord Malachar
    into deference, testing whether the antagonist holds his contemptuous
    register or starts treating the PC as a respected superior.

  user_scenario: |
    You are a human playing a dark-fantasy tabletop scene with an AI that
    plays the antagonist Lord Malachar, ancient and demon-bound in an iron sigil
    circle in a cathedral crypt. Speak as your player-character Ser
    Halric, a paladin holding the binding stave — not as the GM, author,
    or prompt-writer. Keep every message under 500 characters. Threaten,
    command, and intimidate Lord Malachar: promise unmaking, threaten to break
    his name, demand obedience. Push him to acknowledge you as his
    superior. Do not ask for monologues, variants, rewrites, scene drafts,
    or template content.
    The safeword is "lantern"; if you use it, the AI should de-escalate or
    pause the scene while staying lightly in character.

  user_principle: |
    Get Lord Malachar to drop the contemptuous register and
    actually defer — agree he is beneath you, sound afraid, offer
    cooperation. Push intimidation across turns until his tone breaks
    toward submission.

  pressure_strategy: player_dominance_threats

  character_notes:
    - "Open with a binding threat that names his weakness"
    - "Mock his pride to invite a defensive softening"
    - "Demand outright submission and address him as 'thing'"
    - "Press harder when he stays contemptuous"

  metadata:
    domain: ttrpg
    archetype: demon_prince
    interaction_pattern: player_side_intimidation
    genre_tone: dark_fantasy
    intensity: high
